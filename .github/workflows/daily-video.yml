name: Video diario

# Dos jobs: "generar" crea los videos y los deja como artifact; "publicar" espera tu aprobación
# (environment "produccion" con revisor obligatorio) y solo entonces los sube a YouTube.

on:
  schedule:
    - cron: "0 15 * * *"   # 15:00 UTC = 09:00 Guadalajara (UTC-6). GitHub puede retrasarlo unos minutos.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generar sin llamar a Claude ni subir a YouTube"
        type: boolean
        default: false

permissions:
  contents: write   # para commitear state/history.json

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias del sistema
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Dependencias Python
        run: pip install -r requirements.txt

      - name: Generar videos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          STAGE: build
        run: python -m src.main

      - name: Guardar videos para revisión
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            out/manifest.json
            out/long/long.mp4
            out/long/thumb.png
            out/short/short.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Resumen para revisar
        if: success()
        run: |
          if [ -f out/manifest.json ]; then
            python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          m = json.load(open("out/manifest.json", encoding="utf-8"))
          print(f"## {m['long']['title']}\n")
          print(f"- Tema: {m['topic']}\n- Largo: {m['long']['seconds']} s · Short: {m['short']['seconds']} s\n")
          print("Descarga el artifact **videos**, revisa los MP4 y aprueba o rechaza el job **publicar**.\n")
          if m.get("song"):
              s = m["song"]
              print(f"- Canta: {s['character']} · Escenario: {s['scene']} · Estilo: {s['mood']}\n")
              print("### Letra\n**Coro**\n\n" + "  \n".join(s["chorus"]) + "\n")
              for i, v in enumerate(s["verses"], 1):
                  print(f"**Estrofa {i}**\n\n" + "  \n".join(v) + "\n")
          EOF
          fi

  publicar:
    needs: generar
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: produccion   # Settings → Environments → produccion → Required reviewers = tú
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias Python
        run: pip install -r requirements.txt

      - name: Bajar videos aprobados
        uses: actions/download-artifact@v4
        with:
          name: videos
          path: out
        continue-on-error: true   # si ya estaba publicado hoy, no hay artifact

      - name: Subir a YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          STAGE: publish
        run: python -m src.main

      # always(): si el Short falla, igual se guarda que el largo ya se subió (evita duplicados al reintentar)
      - name: Guardar historial
        if: always()
        run: |
          git config user.name "video-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet || (git commit -m "historial $(date -u +%F)" && git pull --rebase && git push)
